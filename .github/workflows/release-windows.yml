# Portable Windows zip.
#
#   Tag push (v1.2.3): build, then publish a GitHub Release with the zip and
#                      its .sha256 attached. The tag must match the version in
#                      web/package.json, so bump that, commit, and tag the commit.
#                      If the release already exists (written by hand on
#                      GitHub, which creates the tag too), the files are added
#                      to it and its title and notes are left alone.
#   Manual run:        build only; the zip is uploaded as a workflow artifact
#                      (Actions -> this run -> Artifacts), and nothing is released.
#
# The build itself is packaging/windows/build.ps1, the same script used locally.

name: Windows release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write # gh release create/upload

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10.28.1

      # Runs pnpm itself. The build puts the Node it bundles first on PATH for
      # everything it compiles, so this version only needs to be able to run pnpm.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Check the tag matches web/package.json
        if: github.ref_type == 'tag'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          $version = (Get-Content web/package.json -Raw | ConvertFrom-Json).version
          if ("v$version" -ne $env:TAG) {
            throw "Tag $env:TAG does not match web/package.json version $version. Set the version to match, commit, and tag that commit."
          }

      - name: Build
        run: ./packaging/windows/build.ps1

      - uses: actions/upload-artifact@v7
        with:
          name: mimiuchi-windows-x64
          path: |
            dist/windows/mimiuchi-*-windows-x64.zip
            dist/windows/mimiuchi-*-windows-x64.zip.sha256
          if-no-files-found: error
          compression-level: 0 # already a zip
          retention-days: 14

      - name: Publish release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          $assets = @(Get-ChildItem dist/windows -File |
            Where-Object Name -match '^mimiuchi-.*-windows-x64\.zip(\.sha256)?$' |
            ForEach-Object FullName)
          if ($assets.Count -ne 2) { throw "Expected the zip and its .sha256, found: $($assets -join ', ')" }

          $notes = @"
          ## Windows

          Download **$(Split-Path $assets[0] -Leaf)**, extract it (right-click > Extract All...), and double-click ``mimiuchi.exe``. No install needed. The ``README.txt`` inside explains the rest, in English and Japanese.

          Windows will warn that the app is from an unknown publisher the first time. Click **More info > Run anyway**.
          "@

          gh release view $env:TAG *> $null
          if ($LASTEXITCODE -eq 0) {
            # A release made by hand on GitHub (which also creates the tag and
            # so starts this run) keeps its title and notes and just gets the
            # files. So does a re-run.
            gh release upload $env:TAG @assets --clobber
          } else {
            # 0.x releases go out as pre-releases, like the hand-made ones.
            $pre = @(if ($env:TAG -match '^v0\.') { '--prerelease' })
            gh release create $env:TAG @assets --notes $notes --generate-notes --verify-tag @pre
          }
          if ($LASTEXITCODE -ne 0) { throw "gh release failed" }
